server {
    listen 80;

    location /api/auth {
        proxy_pass http://auth-service:8000;
        proxy_set_header Host $host;
    }
    location /api/categories {
        proxy_pass http://patrimoine-service:8000;
        proxy_set_header Host $host;
    }
    location /api/demandes {
        proxy_pass http://patrimoine-service:8000;
        proxy_set_header Host $host;
    }
    location /api/biens {
        proxy_pass http://patrimoine-service:8000;
        proxy_set_header Host $host;
    }
    location /api/affectations {
        proxy_pass http://affectation-service:8000;
        proxy_set_header Host $host;
    }
}